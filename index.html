<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Wantlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Game Wantlist</h1>
        <p>Track games you want to purchase.</p>
    </header>

    <section class="card">
        <h2>Add Game</h2>

        <form id="gameForm">

            <input
                type="text"
                id="title"
                placeholder="Game Title"
                required
            >

            <select id="system" required>
                <option value="">Select System</option>
            </select>

            <input
                type="number"
                id="price"
                min="0"
                step="0.01"
                placeholder="Estimated Price"
            >

            <textarea
                id="notes"
                rows="4"
                placeholder="Notes"
            ></textarea>

            <button type="submit">
                Add Game
            </button>

        </form>
    </section>

    <section class="card">

        <div class="toolbar">

            <div>
                <label>
                    System Filter
                </label>

                <select id="systemFilter">
                    <option value="All">All Systems</option>
                </select>
            </div>

            <div>
                <label>
                    Sort By
                </label>

                <select id="sortBy">
                    <option value="title-asc">
                        Title A-Z
                    </option>

                    <option value="title-desc">
                        Title Z-A
                    </option>

                    <option value="price-asc">
                        Price Low-High
                    </option>

                    <option value="price-desc">
                        Price High-Low
                    </option>

                    <option value="date-desc">
                        Newest First
                    </option>

                    <option value="date-asc">
                        Oldest First
                    </option>
                </select>
            </div>

        </div>

        <div id="stats"></div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Select</th>
                        <th class="title-col">Title</th>
                        <th>System</th>
                        <th>Est Price</th>
                        <th>Date Added</th>
                        <th>Notes</th>
                    </tr>
                </thead>

                <tbody id="gameTableBody"></tbody>

            </table>

        </div>

        <div class="button-row">
            <button id="deleteSelected">
                Delete Selected
            </button>

            <button id="exportBtn">
                Export JSON
            </button>

            <label class="import-btn">
                Import JSON
                <input
                    type="file"
                    id="importFile"
                    accept=".json"
                    hidden
                >
            </label>
        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
