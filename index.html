<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Wantlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Game Wantlist</h1>
            <p>Track games you want to buy.</p>
        </header>

        <section class="controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search games..."
            >
        </section>

        <section class="card">
            <h2>Add Game</h2>

            <form id="gameForm">
                <input
                    type="text"
                    id="title"
                    placeholder="Game Title"
                    required
                >

                <select id="platform">
